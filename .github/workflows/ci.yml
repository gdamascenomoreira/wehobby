name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: wehobby
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: wehobby
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wehobby"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://wehobby:ci-only-not-a-secret@localhost:5432/postgres

      - name: Build
        run: npm run build

  images:
    name: Build images and smoke test the VM stack
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      IMAGE_PREFIX: local
      IMAGE_TAG: ci
      # Settings for deploy/vm/compose.yaml. Placeholders only, never real ids.
      SITE_ADDRESS: ':80'
      DATA_DIR: ./.data
      POSTGRES_PASSWORD: ci-only-not-a-secret
      AUTH_TENANT_ID: 00000000-0000-4000-8000-000000000001
      AUTH_TENANT_SUBDOMAIN: wehobbyci
      AUTH_API_CLIENT_ID: 00000000-0000-4000-8000-000000000002
      AUTH_WEB_CLIENT_ID: 00000000-0000-4000-8000-000000000003
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build API image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: api/Dockerfile
          load: true
          tags: ${{ env.IMAGE_PREFIX }}/wehobby-api:${{ env.IMAGE_TAG }}
          build-args: APP_VERSION=ci-${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build web image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: web/Dockerfile
          load: true
          tags: ${{ env.IMAGE_PREFIX }}/wehobby-web:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      # Runs deploy/vm/compose.yaml as on the VM (steps 11 and 12), over plain
      # HTTP on :80, with placeholder Entra ids.
      - name: Start the database and apply migrations
        working-directory: deploy/vm
        run: |
          docker compose up --detach --wait --wait-timeout 120 db
          docker compose run --rm api node api/dist/migrate.js

      - name: Start the VM stack
        working-directory: deploy/vm
        run: docker compose up --detach --wait --wait-timeout 120

      - name: Smoke test
        run: |
          set -euo pipefail
          curl --fail --silent --show-error http://localhost/health
          echo
          curl --fail --silent --show-error http://localhost/api/health | tee /dev/stderr | grep -q '"status":"ok"'
          echo
          # The browser gets its sign in settings from the API.
          curl --fail --silent --show-error http://localhost/api/config | tee /dev/stderr | grep -q "\"clientId\":\"$AUTH_WEB_CLIENT_ID\""
          echo
          # Profile routes refuse anonymous requests.
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost/api/me)" = 401
          # Unknown paths fall back to the app shell (client side routing).
          curl --fail --silent --show-error http://localhost/some/page | grep -q '<div id="root">'
          # Only Caddy is published on the host.
          if curl --silent --max-time 2 http://localhost:3000/api/health; then
            echo "::error::The API is reachable on the host"
            exit 1
          fi
          # The CSP allows the sign in origin.
          curl --silent --show-error --head http://localhost/ | grep -i 'content-security-policy' | grep -q "https://$AUTH_TENANT_SUBDOMAIN.ciamlogin.com"

      - name: Logs
        if: always()
        working-directory: deploy/vm
        run: docker compose logs --no-color || true
