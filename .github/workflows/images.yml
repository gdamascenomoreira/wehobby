name: Images

# Builds and pushes the images the scenario 01 VM runs. Deploying a tag to the
# VM is a manual step for now (docs/scenarios/01-iaas/portal-guide.md, step 11).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  push:
    name: Push ${{ matrix.image }} image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: api/Dockerfile
            description: WeHobby API
          - image: web
            dockerfile: web/Dockerfile
            description: WeHobby web app and Caddy edge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Image name and tag
        id: meta
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ matrix.image }}
        run: |
          echo "repository=ghcr.io/${OWNER,,}/wehobby-${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.meta.outputs.repository }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.repository }}:main
          build-args: APP_VERSION=${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=${{ matrix.description }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

      - name: Summary
        env:
          IMAGE: ${{ steps.meta.outputs.repository }}:${{ steps.meta.outputs.tag }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          {
            echo "Pushed \`$IMAGE\`."
            echo
            echo "Deploy on the VM with \`IMAGE_TAG=$TAG\` in \`/opt/wehobby/.env\`."
          } >> "$GITHUB_STEP_SUMMARY"
