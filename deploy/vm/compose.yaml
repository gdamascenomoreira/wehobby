# WeHobby on the scenario 01 VM. Lives in /opt/wehobby next to its .env file.
# See docs/scenarios/01-iaas/portal-guide.md, steps 11 and 12.
#
# The same file and image tag run on every VM. What differs between VMs lives
# in .env only (see .env.example).
#
# Only Caddy publishes ports. The API and the database are reachable on the
# Compose network only.

services:
  caddy:
    image: ${IMAGE_PREFIX:-ghcr.io/gdamascenomoreira}/wehobby-web:${IMAGE_TAG:?set IMAGE_TAG in .env}
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      # Required, so a VM never asks for certificates for another VM's names.
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
      API_UPSTREAM: api:3000
      AUTH_ORIGIN: https://${AUTH_TENANT_SUBDOMAIN:?set AUTH_TENANT_SUBDOMAIN in .env}.ciamlogin.com
    volumes:
      # Certificates and ACME account, kept from step 9d.
      - ${DATA_DIR:-/datadisk}/caddy/data:/data
      - ${DATA_DIR:-/datadisk}/caddy/config:/config
    depends_on:
      api:
        condition: service_healthy

  # One-shot: applies pending database migrations, then exits. It runs on every
  # `docker compose up -d`, before the API starts, so an empty database works
  # with no manual step, and migrations run once per deploy even if several API
  # containers run later. Check it with `docker compose logs migrate`.
  migrate:
    image: ${IMAGE_PREFIX:-ghcr.io/gdamascenomoreira}/wehobby-api:${IMAGE_TAG:?set IMAGE_TAG in .env}
    restart: 'no'
    working_dir: /app/api
    command: ['node', 'dist/migrate.js']
    environment:
      # The password is hex (step 9d), so it needs no URL encoding.
      DATABASE_URL: &database-url postgres://wehobby:${POSTGRES_PASSWORD}@db:5432/wehobby
    depends_on:
      db:
        condition: service_healthy

  api:
    image: ${IMAGE_PREFIX:-ghcr.io/gdamascenomoreira}/wehobby-api:${IMAGE_TAG:?set IMAGE_TAG in .env}
    restart: unless-stopped
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Caddy is the only client, and it sets X-Forwarded-For to the real client IP.
      TRUST_PROXY: 'true'
      DATABASE_URL: *database-url
      AUTH_TENANT_ID: ${AUTH_TENANT_ID:?set AUTH_TENANT_ID in .env}
      AUTH_TENANT_SUBDOMAIN: ${AUTH_TENANT_SUBDOMAIN}
      AUTH_API_CLIENT_ID: ${AUTH_API_CLIENT_ID:?set AUTH_API_CLIENT_ID in .env}
      AUTH_WEB_CLIENT_ID: ${AUTH_WEB_CLIENT_ID:?set AUTH_WEB_CLIENT_ID in .env}
    # Healthy only when the database answers and every migration is applied,
    # so Caddy starts only when the API can really serve requests.
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3000/api/ready || exit 1']
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Unchanged from step 9d, so the existing data on the data disk is reused.
  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: wehobby
      POSTGRES_USER: wehobby
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - ${DATA_DIR:-/datadisk}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wehobby -d wehobby']
      interval: 10s
      timeout: 5s
      retries: 5
