# Local development services. Not used by the code yet.
# Credentials below are local only placeholders. Override them in .env.local.
name: wehobby

services:
  postgres:
    image: postgis/postgis:17-3.5 # same as the scenario 01 VM
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wehobby}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-wehobby}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --location /data --skipApiVersionCheck
    ports:
      - '127.0.0.1:10000:10000'
    volumes:
      - azurite-data:/data

volumes:
  postgres-data:
  azurite-data:
